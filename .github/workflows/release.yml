name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: Shellmate
  BUNDLE_ID: com.shellmate.app

jobs:
  build-mac:
    name: Build, Sign, Notarize & Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import code signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Build release binary
        run: swift build -c release

      - name: Assemble .app bundle
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD="${GITHUB_RUN_NUMBER}"
          APP_DIR="build/$APP_NAME.app/Contents"

          # Create bundle structure
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          # Copy binary
          cp .build/release/Shellmate "$APP_DIR/MacOS/Shellmate"

          # Copy resources (processed by SPM into the bundle)
          if [ -d ".build/release/Shellmate_Shellmate.bundle" ]; then
            cp -R .build/release/Shellmate_Shellmate.bundle "$APP_DIR/Resources/"
          fi

          # Generate Info.plist with version from tag
          cat > "$APP_DIR/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleDisplayName</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>$BUNDLE_ID</string>
              <key>CFBundleVersion</key>
              <string>$BUILD</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2026 Adam Sneed. All rights reserved.</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>NSMainStoryboardFile</key>
              <string></string>
              <key>SUFeedURL</key>
              <string>https://github.com/adamlsneed/shellmate-macos/releases/latest/download/appcast.xml</string>
              <key>SUPublicEDKey</key>
              <string>g6S3qtLmcbDQKMZPGagQVTSnoUPMXTCCBv2qj4tN8l4=</string>
              <key>SUEnableAutomaticChecks</key>
              <true/>
              <key>SUScheduledCheckInterval</key>
              <integer>86400</integer>
              <key>SUAllowsAutomaticUpdates</key>
              <false/>
              <key>NSCalendarsFullAccessUsageDescription</key>
              <string>Shellmate needs calendar access to create events, check your schedule, and manage appointments on your behalf.</string>
              <key>NSRemindersFullAccessUsageDescription</key>
              <string>Shellmate needs reminders access to create, complete, and manage your reminders.</string>
              <key>NSContactsUsageDescription</key>
              <string>Shellmate needs contacts access to look up contact information and add new contacts on your behalf.</string>
              <key>NSAppleEventsUsageDescription</key>
              <string>Shellmate needs automation access to interact with Notes, Mail, Music, and other apps on your behalf.</string>
              <key>NSScreenCaptureUsageDescription</key>
              <string>Shellmate needs screen capture access to take screenshots when you ask.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Shellmate needs microphone access for voice dictation and speech recognition.</string>
          </dict>
          </plist>
          PLIST

          # Copy entitlements for signing
          cp Shellmate/Resources/Shellmate.entitlements build/Shellmate.entitlements

          echo "App bundle assembled at build/$APP_NAME.app"
          find "build/$APP_NAME.app" -type f | head -20

      - name: Code sign app bundle
        run: |
          codesign --force --deep --sign "${{ secrets.DEVELOPER_ID_APPLICATION }}" \
            --options runtime \
            --entitlements build/Shellmate.entitlements \
            "build/$APP_NAME.app"

          # Verify signature
          codesign --verify --deep --strict "build/$APP_NAME.app"
          echo "Code signing verified successfully"

      - name: Create DMG
        run: |
          brew install create-dmg || true

          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg" \
            "build/$APP_NAME.app" \
            || {
              echo "create-dmg layout failed, creating simple DMG..."
              hdiutil create \
                -volname "$APP_NAME" \
                -srcfolder "build/$APP_NAME.app" \
                -ov -format UDZO \
                "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg"
            }

          ls -la "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Import notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Notarize DMG
        run: |
          xcrun notarytool submit \
            "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg" \
            --keychain-profile "AC_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          chmod +x ci/generate-appcast.sh
          ci/generate-appcast.sh \
            "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg" \
            "${{ steps.version.outputs.VERSION }}" \
            "$GITHUB_RUN_NUMBER"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}.dmg
            build/appcast.xml
          generate_release_notes: true
          draft: false

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
