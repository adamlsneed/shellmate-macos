name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: Shellmate
  BUNDLE_ID: com.shellmate.app

jobs:
  build-mac:
    name: Build, Sign, Notarize & Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import code signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Build universal release binary
        run: |
          # Build both arches, then lipo into a universal binary so the app runs
          # on both Apple Silicon and Intel Macs. Per project memory, the target
          # audience includes older non-technical users — many of whom have Intel
          # hardware. If either arch fails, surface the failure rather than
          # silently shipping an arm64-only binary.
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p build
          lipo -create -output build/Shellmate-universal \
            .build/arm64-apple-macosx/release/Shellmate \
            .build/x86_64-apple-macosx/release/Shellmate
          file build/Shellmate-universal

      - name: Assemble .app bundle
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD="${GITHUB_RUN_NUMBER}"
          APP_DIR="build/$APP_NAME.app/Contents"

          # Create bundle structure
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          # Copy the universal binary built in the previous step.
          cp build/Shellmate-universal "$APP_DIR/MacOS/Shellmate"

          # Copy resources (processed by SPM into the bundle).
          # Try both arch-specific paths since the universal build produces them separately.
          if [ -d ".build/arm64-apple-macosx/release/Shellmate_Shellmate.bundle" ]; then
            cp -R .build/arm64-apple-macosx/release/Shellmate_Shellmate.bundle "$APP_DIR/Resources/"
          elif [ -d ".build/release/Shellmate_Shellmate.bundle" ]; then
            cp -R .build/release/Shellmate_Shellmate.bundle "$APP_DIR/Resources/"
          fi

          # Embed Sparkle.framework. Prefer a universal artifact path; fall back
          # to arm64 (Sparkle's xcframework usually contains a universal binary
          # in the macos slice already).
          mkdir -p "$APP_DIR/Frameworks"
          SPARKLE_FW=$(find .build/artifacts -path "*/macos*/Sparkle.framework" -type d | head -1)
          if [ -n "$SPARKLE_FW" ]; then
            cp -R "$SPARKLE_FW" "$APP_DIR/Frameworks/"
            echo "Embedded Sparkle.framework from $SPARKLE_FW"
            # Verify it's universal — if arm64-only, the Intel build would crash at launch.
            file "$APP_DIR/Frameworks/Sparkle.framework/Versions/B/Sparkle" || true
          else
            echo "::error::Sparkle.framework not found in build artifacts"
            exit 1
          fi

          # Add @executable_path/../Frameworks to rpath so the binary finds Sparkle
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/MacOS/Shellmate"
          echo "Added Frameworks rpath to binary"

          # Build app icon from Assets.xcassets PNGs
          ICONSET_DIR="build/AppIcon.iconset"
          ICON_SRC="Shellmate/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET_DIR"
          cp "$ICON_SRC"/icon_*.png "$ICONSET_DIR/"
          iconutil --convert icns --output "$APP_DIR/Resources/AppIcon.icns" "$ICONSET_DIR"
          echo "Generated AppIcon.icns"

          # Use the root Info.plist as the single source of truth (so anyone
          # adding a new TCC usage string sees it take effect in release builds).
          # Inject the per-build version + build number via PlistBuddy.
          cp Info.plist "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_DIR/Info.plist"

          # Copy entitlements for signing
          cp Shellmate/Resources/Shellmate.entitlements build/Shellmate.entitlements

          echo "App bundle assembled at build/$APP_NAME.app"
          find "build/$APP_NAME.app" -type f | head -20

      - name: Code sign app bundle
        run: |
          IDENTITY="${{ secrets.DEVELOPER_ID_APPLICATION }}"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Sign Sparkle framework components inside-out.
          # Pass --keychain explicitly so codesign uses the temp keychain we
          # populated rather than picking a same-CN identity from login.keychain.
          SPARKLE_DIR="build/$APP_NAME.app/Contents/Frameworks/Sparkle.framework/Versions/B"
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/XPCServices/Downloader.xpc/Contents/MacOS/Downloader" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/XPCServices/Downloader.xpc" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/XPCServices/Installer.xpc/Contents/MacOS/Installer" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/XPCServices/Installer.xpc" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/Autoupdate" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/Updater.app/Contents/MacOS/Updater" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE_DIR/Updater.app" || true
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "build/$APP_NAME.app/Contents/Frameworks/Sparkle.framework"

          # Explicitly re-sign the inner Mach-O binary BEFORE signing the
          # bundle. install_name_tool -add_rpath (run during bundle assembly)
          # invalidates the linker's ad-hoc signature; bundle-level codesign
          # without --deep won't always pick that up. This guarantees the
          # binary carries a valid signature.
          codesign --force --sign "$IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" \
            "build/$APP_NAME.app/Contents/MacOS/Shellmate"

          # Sign the main app bundle
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements build/Shellmate.entitlements \
            --keychain "$KEYCHAIN_PATH" \
            "build/$APP_NAME.app"

          # Verify signature
          codesign --verify --deep --strict "build/$APP_NAME.app"
          echo "Code signing verified successfully"

      - name: Create DMG
        run: |
          brew install create-dmg || true

          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg" \
            "build/$APP_NAME.app" \
            || {
              echo "create-dmg layout failed, creating simple DMG..."
              hdiutil create \
                -volname "$APP_NAME" \
                -srcfolder "build/$APP_NAME.app" \
                -ov -format UDZO \
                "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg"
            }

          ls -la "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Import notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Store the credential in the temp keychain so it gets cleaned up
          # by the always() step below — without --keychain it lands in the
          # default login keychain and persists past job teardown.
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$RUNNER_TEMP/app-signing.keychain-db"

      - name: Notarize DMG
        run: |
          xcrun notarytool submit \
            "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg" \
            --keychain-profile "AC_PASSWORD" \
            --keychain "$RUNNER_TEMP/app-signing.keychain-db" \
            --wait

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          chmod +x ci/generate-appcast.sh
          ci/generate-appcast.sh \
            "build/$APP_NAME-${{ steps.version.outputs.VERSION }}.dmg" \
            "${{ steps.version.outputs.VERSION }}" \
            "$GITHUB_RUN_NUMBER"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}.dmg
            build/appcast.xml
          generate_release_notes: true
          draft: false

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
